# Base Kamal config. Destination-specific overrides (service, host, env,
# volume) live in:
#   config/deploy.production.yml  → kamal -d production
#   config/deploy.staging.yml     → kamal -d staging
#
# `require_destination: true` below blocks a bare `kamal deploy` (no -d flag)
# so the wrong environment cannot be hit by accident. Cribbed from partypic's
# pattern — same dual-destination shape, single-host minimum for v1.

require_destination: true

# Container image. Edit registry server/username when you wire a real registry.
# (Default scaffold uses localhost:5555 — replace before first deploy.)
image: coolors_app

# Deploy to these servers. Shared between both destinations for now.
# Single-host minimum — split web/job when traffic justifies it.
servers:
  web:
    - PLACEHOLDER_HOST_REPLACE_BEFORE_DEPLOY
  # job:
  #   hosts:
  #     - PLACEHOLDER_HOST_REPLACE_BEFORE_DEPLOY
  #   cmd: bin/jobs

# SSL is destination-specific (per-host routing on a shared proxy).
# `kamal proxy` only boots once per host; per-app proxy stanzas are merged
# at deploy time.
# proxy: — see config/deploy.<destination>.yml

# Container image registry. Replace server/username/password before first
# deploy — defaults are scaffold placeholders.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: PLACEHOLDER_REGISTRY_SERVER
  username: PLACEHOLDER_REGISTRY_USER
  password:
    - KAMAL_REGISTRY_PASSWORD

# Base env block: destination files may add or replace entries.
# `env.secret` is an array, so destination overrides must include the complete list.
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true

# Aliases — wrappers around `kamal app exec` for common ops.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent volume + asset-path are defined in each destination file
# because `volumes` is an array that would otherwise be replaced in its entirety.
#
# volumes:        — see config/deploy.<destination>.yml
# asset_path:     — see config/deploy.<destination>.yml

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.3
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# SSH user for deployment (defaults to root).
# ssh:
#   user: app
